<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вариант C1 (Next.js + headless CMS) — превью</title>
<style>
  body { margin:0; background:#1b2430; font-family:Arial,sans-serif; }
  .row { display:flex; gap:24px; padding:24px; align-items:flex-start; flex-wrap:wrap; }
  .lbl { color:#cbd5e1; font-size:13px; margin-bottom:8px; font-weight:600; }
  .frame { border-radius:8px; overflow:hidden; background:#fff; box-shadow:0 20px 50px -18px rgba(0,0,0,.8); }
  iframe { border:0; display:block; }
  .phone { width:391px; height:844px; border:10px solid #05080d; border-radius:38px; overflow:hidden; position:relative; }
  .phone iframe { width:391px; height:100%; }
  .desktop { width:1280px; height:1000px; }
  .desktop iframe { width:1280px; height:1000px; }
</style>
</head>
<body>
<div class="row">
  <div>
    <div class="lbl">Desktop 1280 — главная</div>
    <div class="frame desktop"><iframe id="f1" src="/"></iframe></div>
  </div>
  <div>
    <div class="lbl">iPhone 390 — главная</div>
    <div class="frame phone"><iframe id="f2" src="/"></iframe></div>
  </div>
  <div>
    <div class="lbl">Desktop 1280 — карточка товара</div>
    <div class="frame desktop"><iframe id="f3" src="/arendadizelnogogeneratora100kvt"></iframe></div>
  </div>
</div>
</body>
</html>
